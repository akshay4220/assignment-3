<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- <link rel="stylesheet" href="style.css">
 lin -->
 <style>
  #nav{
    max-height: 100px ;
    background-color:rgb(144, 213, 83) ;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 61px ;

    font-weight: bold 
    ;
    color: white;



  }
  .box{
    width: 80px ;
    height: 60px ;
    border: 4px solid rgb(229, 122, 199);
   display: flex;
   align-items: center;
   justify-content: center;
border-radius: 15px ;
  }
  #box-container{
    display: flex;
    justify-content: space-around;
    margin: 4%;


  }
  .input-section{
    display: flex;
    justify-content: center;
    margin: 10%;
  }


 </style>
<body>


<div id="nav">
    Hello 

</div>
<div id="box-container">
    <div id="box-1" class="box">Green</div>
    <div id="box-2" class="box">Blue</div>
    <div id="box-3" class="box">Red</div>
    <div id="box-4" class="box">Purple</div>
</div>


<div class="input-section">
   <input id="input" type="text" placeholder="enter your name..">
   <button id="btn" type="button"> just Greet it  </button>
</div>


    <script>
  let box1 = document.getElementById("box-1")
  let box2 = document.getElementById("box-2")
  let box3 = document.getElementById("box-3")
  let box4 = document.getElementById("box-4")


   let nav = document.getElementById("nav")
   let input = document.getElementById("input")
   let btn = document.getElementById("btn")
 
 

 box1.addEventListener('click', ()=>{
    box1.style.backgroundColor="green";
   setTimeout(() => {
      box1.style.backgroundColor=""
   }, 1000);
   
 })
 box2.addEventListener('click', ()=>{
    box2.style.backgroundColor="blue";
   setTimeout(() => {
      box2.style.backgroundColor=""
   }, 1000);
   
 })
 box3.addEventListener('click', ()=>{
    box3.style.backgroundColor="red";
   setTimeout(() => {
      box3.style.backgroundColor=""
   }, 1000);
   
 })


 box4.addEventListener("click", ()=>{
    box4.style.backgroundColor="purple"
  setTimeout(() => {
     box4.style.backgroundColor=""
  },2000);
 })




 btn.addEventListener("click", ()=>{
    nav.textContent= ` Hello ${input.value} !`
 })

    </script>
</body>
</html>
